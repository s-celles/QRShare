# Publish the shared collaboration core (src/collab/core) as a git dependency.
# Pushing a tag `collab-vX.Y.Z` builds the package and commits it to the
# `collab-dist` branch, tagged `collab-dist-vX.Y.Z`, so apps can depend on
# "github:s-celles/QRShare#collab-dist-vX.Y.Z".
name: Collab package

on:
  push:
    tags: ["collab-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun test tests/collab
      - run: bun run scripts/build-collab.ts
      - name: Check the tag matches the package version
        id: version
        run: |
          version=$(jq -r .version dist-collab/package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "collab-v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
      - name: Commit to the collab-dist branch
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          source_sha=$(git rev-parse HEAD)
          work=$(mktemp -d)
          if git ls-remote --exit-code --heads origin collab-dist >/dev/null; then
            git worktree add "$work" origin/collab-dist
            git -C "$work" checkout -B collab-dist
          else
            git worktree add --detach "$work"
            git -C "$work" checkout --orphan collab-dist
          fi
          git -C "$work" rm -rq --ignore-unmatch .
          cp -r dist-collab/. "$work/"
          git -C "$work" add -A
          git -C "$work" commit -m "chore(collab): build @scelles/collab $VERSION from $source_sha" --allow-empty
          git -C "$work" tag -f "collab-dist-v$VERSION"
          git -C "$work" push origin collab-dist
          git -C "$work" push -f origin "collab-dist-v$VERSION"
